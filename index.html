<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <div class="header-icons" aria-hidden="true">
        <!-- Sun -->
        <svg viewBox="0 0 24 24" class="icon-sun" xmlns="http://www.w3.org/2000/svg" role="img"><circle cx="12" cy="12" r="4" stroke="currentColor"/><g stroke="currentColor"><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g></svg>
        <!-- Cloud -->
        <svg viewBox="0 0 24 24" class="icon-cloud" xmlns="http://www.w3.org/2000/svg" role="img"><path d="M20 18H7a4 4 0 0 1 0-8 6 6 0 0 1 11.3 1.6A4.5 4.5 0 0 1 20 18z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <!-- Rain -->
        <svg viewBox="0 0 24 24" class="icon-rain" xmlns="http://www.w3.org/2000/svg" role="img"><path d="M16 13a4 4 0 0 0-8 0" stroke="currentColor" fill="none"/><path d="M8 19l0 0M12 19l0 0M16 19l0 0" stroke="currentColor" stroke-linecap="round"/></svg>
      </div>
      <form id="search-form" class="search-form" aria-label="Search city weather">
        <input id="city-input" type="search" placeholder="Enter city (e.g. London)" required />
        <button type="submit">Search</button>
      </form>
    </header>

  <section id="alert" class="alert visually-hidden" role="alert"></section>

  <div class="dashboard-grid">
  <section id="current" class="card current-card visually-hidden" aria-live="polite">
      <div class="location-row">
        <h2 id="city-name">City</h2>
        <small id="local-time">--:--</small>
      </div>

      <div class="current-main">
        <div class="icon-wrap">
          <img id="current-icon" alt="" />
        </div>
        <div class="current-details">
          <div class="temp" id="current-temp">--°C</div>
          <div class="desc" id="current-desc">Description</div>
          <div class="meta">
            <span id="current-humidity">Humidity: --%</span>
            <span id="current-wind">Wind: -- m/s</span>
          </div>
        </div>
      </div>
  </section>

  <section id="forecast" class="card forecast-card visually-hidden">
      <h3>5-Day Forecast</h3>
      <div id="forecast-grid" class="forecast-grid" role="list"></div>
  </section>
  </div>

    <footer class="app-footer">
      <small>Data from OpenWeatherMap</small>
    </footer>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
